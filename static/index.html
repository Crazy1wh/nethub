<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>内网导航</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1c2029; --border:#242936;
  --text:#e5e7eb; --dim:#8b93a3; --accent:#4f8cff;
  --ok:#34d399; --auth:#fbbf24; --bad:#f87171; --gray:#4b5563;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:22px;font-weight:700;letter-spacing:.5px}
h1 .acc{color:var(--accent)}
.sub{color:var(--dim);font-size:12px;margin-bottom:20px}
input[type=text]{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:14px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
#search{flex:1;min-width:180px;max-width:380px}
.btn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg-btn{background:transparent;border:none;color:var(--dim);padding:8px 14px;font-size:13px;cursor:pointer}
.seg-btn.active{background:var(--accent);color:#fff}
#statusbar{color:var(--dim);font-size:12px;margin:0 0 16px}
#statusbar b{color:var(--ok)}
.group{margin-bottom:28px}
.group h2{font-size:15px;color:var(--dim);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.group h2::before{content:'';width:4px;height:14px;background:var(--accent);border-radius:2px;display:inline-block}
.group h2 .cnt{color:var(--gray);font-weight:400}
.group h2 .arrow{color:var(--gray);font-size:11px;margin-left:2px}
.group.collapsed .grid{display:none}
.group.collapsed h2{margin-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.15s;text-decoration:none;color:var(--text)}
.card:hover{border-color:var(--accent);transform:translateY(-2px);background:var(--card2)}
.card.hidden{opacity:.35}
.card.hidden:hover{opacity:.75}
.ic{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;overflow:hidden;background:#2a2f3a}
.ic img{width:100%;height:100%;object-fit:contain;background:#fff}
.info{min-width:0;flex:1}
.info .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .ur{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dot{display:none;position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%}
.card .dot.on{background:var(--ok)}.card .dot.auth{background:var(--auth)}.card .dot.off{background:var(--bad)}.card .dot.un{background:var(--gray)}
.acts{position:absolute;bottom:8px;right:8px;display:none;gap:4px}
@media(hover:hover){.card:hover .acts{display:flex}}
.acts button{background:var(--card2);border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer}
.acts button:hover{color:#fff;border-color:var(--accent)}
.acts button.del:hover{border-color:var(--bad);color:var(--bad)}
.badge{position:absolute;top:8px;right:24px;font-size:10px;color:var(--dim);background:var(--card2);border:1px solid var(--border);border-radius:4px;padding:0 4px;display:none}
.card.hidden .badge{display:block}
.empty{color:var(--gray);padding:30px;text-align:center}
/* 添加/编辑面板 */
.panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px}
.panel.show{display:block}
.panel h3{font-size:14px;margin-bottom:12px;color:var(--dim)}
.panel .row{display:flex;gap:8px;flex-wrap:wrap}
.panel input{flex:1;min-width:140px}
.panel .hint{font-size:11px;color:var(--gray);margin-top:8px}
.editing{border-color:var(--accent)}
.editing .info{display:none}
.edform{display:none;flex-direction:column;gap:6px;width:100%}
.editing .edform{display:flex}
.edform .r{display:flex;gap:6px}
.edform .r input{flex:1;min-width:0;padding:5px 8px;font-size:12px}
.edform .r button{padding:5px 10px;font-size:12px}
@media(max-width:600px){
  .wrap{padding:12px 12px 40px}
  header{gap:8px;margin-bottom:4px}
  h1{font-size:18px;margin-right:auto}
  #search{order:3;flex-basis:100%;min-width:0;width:100%;font-size:16px;padding:9px 12px} /* 16px 防 iOS 聚焦缩放 */
  .seg{order:2}
  #btnScan{order:4}
  #btnAdd{order:5}
  .seg-btn{padding:8px 11px;font-size:12px}
  .btn{padding:8px 11px;font-size:12px}
  .sub{font-size:11px;margin-bottom:12px}
  #statusbar{font-size:11px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{padding:10px;gap:8px;border-radius:10px;flex-wrap:wrap}
  .ic{width:32px;height:32px;border-radius:8px;font-size:15px}
  .info .nm{font-size:13px}
  .info .ur{font-size:10px}
  .dot{top:8px;right:8px;width:7px;height:7px}
  /* 移动端不显示操作按钮, 点击卡片直接打开链接 */
  .acts{display:none!important}
  .group{margin-bottom:20px}
  .group h2{font-size:14px}
  .panel{padding:12px}
  .panel .row{flex-direction:column;gap:8px}
  .panel .row input{width:100%}
  .panel .row .btn{width:100%}
  .edform .r input{font-size:13px}
  .empty{padding:20px;font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>内网<span class="acc">导航</span></h1>
    <input type="text" id="search" placeholder="搜索名称 / 地址 / 分组...">
    <span class="seg" id="segGroup">
      <button class="seg-btn active" data-mode="logical">分组</button><button class="seg-btn" data-mode="ip">按IP</button>
    </span>
    <button class="btn" id="btnScan">⟳ 重新扫描</button>
    <button class="btn primary" id="btnAdd">＋ 添加</button>
  </header>
  <div class="sub" id="sub"></div>
  <div id="statusbar"></div>
  <div class="panel" id="addPanel">
    <h3>手动添加站点</h3>
    <div class="row">
      <input type="text" id="addName" placeholder="名称(留空自动抓标题)">
      <input type="text" id="addUrl" placeholder="http://192.168.1.x:端口/">
      <input type="text" id="addGroup" placeholder="分组(常用/自定义, 留空=手工)">
      <button class="btn primary" id="addOk">保存</button>
      <button class="btn" id="addCancel">取消</button>
    </div>
    <div class="hint">保存前会自动探测站点标题与状态</div>
  </div>
  <div id="content"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let sites=[], lastScan=null, ownIp='', groupMode='logical';

async function api(path,opt){
  const r=await fetch(path,opt);
  if(!r.ok){let m='请求失败';try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}
  return r.json();
}

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function colorOf(name){
  let h=0;for(const ch of (name||'?'))h=(h*31+ch.charCodeAt(0))>>>0;
  const pal=['#4f8cff','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6'];
  return pal[h%pal.length];
}

function iconHTML(s){
  const ic=s.icon||'';
  const letter=esc((s.name||'?')[0]).toUpperCase();
  if(ic.startsWith('saved:')||ic.startsWith('http')){
    const src=ic.startsWith('saved:')?'/icons/'+ic.slice(6):esc(ic);
    return `<img src="${src}" onerror="this.outerHTML='<span>${letter}</span>'">`;
  }
  return letter;
}

function dotClass(s){
  if(s.status==='online')return 'on';
  if(s.status==='auth')return 'auth';
  if(s.status==='offline')return 'off';
  return 'un';
}

function cardHTML(s){
  const st={online:'在线',auth:'需认证',offline:'离线',unknown:'未知'}[s.status]||s.status;
  return `<a class="card${s.hidden?' hidden':''}" href="${esc(s.url)}" target="_blank" rel="noopener" data-id="${s.id}">
    <span class="ic" style="background:${colorOf(s.name)}">${iconHTML(s)}</span>
    <span class="info">
      <span class="nm">${esc(s.name)}</span>
      <span class="ur">${esc(s.url.replace(/^https?:\/\//,''))}</span>
    </span>
    <span class="dot ${dotClass(s)}" title="${st} · ${s.status_code||''}"></span>
    <span class="badge">已隐藏</span>
    <span class="acts">
      <button class="fav" title="${s.favorite?'取消收藏':'收藏到常用'}">${s.favorite?'★':'☆'}</button>
      <button class="ed" title="编辑">✎</button>
      <button class="tg" title="${s.hidden?'恢复显示':'隐藏'}">${s.hidden?'👁':'🙈'}</button>
      <button class="del" title="${s.hidden?'彻底删除':'删除(可恢复)'}">✕</button>
    </span>
    <span class="edform">
      <input type="text" class="f-name" value="${esc(s.name)}" placeholder="名称">
      <input type="text" class="f-group" value="${esc(s.group_name||'')}" placeholder="分组(常用/自定义)">
      <span class="r"><button class="ok btn primary">保存</button><button class="no btn">取消</button></span>
    </span>
  </a>`;
}

function groupKeysOf(s){
  if(s.hidden) return ['已隐藏'];
  if(s.favorite) return ['常用'];  // 收藏后只显示在「常用」, 不再出现在原分组
  if(groupMode==='ip'){
    if(!s.host_ip||s.host_ip==='127.0.0.1')return ['本机'];
    return [s.host_ip===ownIp?'本机':s.host_ip];
  }
  return [s.group_name||'未分组'];
}

function render(){
  const q=($('#search').value||'').trim().toLowerCase();
  const list=sites.filter(s=>{
    if(!q)return true;
    return (s.name+' '+s.url+' '+(s.group_name||'')+' '+(s.host_ip||'')).toLowerCase().includes(q);
  });
  const groups={};
  for(const s of list){for(const g of groupKeysOf(s)){(groups[g]=groups[g]||[]).push(s)}}
  let keys=Object.keys(groups);
  const rank=g=>g==='已隐藏'?99:(g==='常用'?-1:0);
  keys.sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
  const online=list.filter(s=>s.status==='online').length;
  const hidden=sites.filter(s=>s.hidden).length;
  $('#statusbar').innerHTML=`共 <b>${list.length}</b> 个站点 · 在线 <b>${online}</b> 个 · 已隐藏 <b>${hidden}</b> 个`+
    (lastScan?` · 上次扫描: ${lastScan.finished_at||''} (发现 ${lastScan.found||0} 个)`:'');
  if(!keys.length){$('#content').innerHTML='<div class="empty">暂无站点,点击「重新扫描」自动发现局域网服务</div>';return}
  $('#content').innerHTML=keys.map(g=>{
    const collapsed=g==='已隐藏'&&!q;  // 已隐藏分组默认折叠(搜索时自动展开)
    return `<div class="group${collapsed?' collapsed':''}"><h2>${esc(g)} <span class="cnt">${groups[g].length}</span> <span class="arrow">${collapsed?'▸':'▾'}</span></h2>
    <div class="grid">${groups[g].map(cardHTML).join('')}</div></div>`;
  }).join('');
}

async function load(){
  const d=await api('/api/sites');
  sites=d.sites; ownIp=d.own_ip;
  try{lastScan=(await api('/api/scan/status')).last}catch(e){}
  render();
}

async function doScan(){
  const b=$('#btnScan');b.disabled=true;b.textContent='扫描中…';
  try{await api('/api/scan',{method:'POST'})}catch(e){}
  const t=setInterval(async()=>{
    try{
      const st=await api('/api/scan/status');
      if(!st.running){clearInterval(t);b.disabled=false;b.textContent='⟳ 重新扫描';await load();}
    }catch(e){clearInterval(t);b.disabled=false;b.textContent='⟳ 重新扫描'}
  },2000);
}

$('#btnScan').onclick=doScan;
$('#search').oninput=render;
$('#segGroup').addEventListener('click',ev=>{
  const b=ev.target.closest('.seg-btn');if(!b)return;
  groupMode=b.dataset.mode;
  document.querySelectorAll('#segGroup .seg-btn').forEach(x=>x.classList.toggle('active',x===b));
  render();
});
$('#btnAdd').onclick=()=>$('#addPanel').classList.toggle('show');
$('#addCancel').onclick=()=>{$('#addPanel').classList.remove('show')};
$('#addOk').onclick=async()=>{
  const url=$('#addUrl').value.trim();if(!url){alert('请输入 URL');return}
  try{
    await api('/api/sites',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:$('#addName').value.trim(),url,group:$('#addGroup').value.trim()})});
    $('#addPanel').classList.remove('show');$('#addName').value=$('#addUrl').value=$('#addGroup').value='';
    await load();
  }catch(e){alert(e.message)}
};

$('#content').addEventListener('click',async ev=>{
  const h=ev.target.closest('.group h2');  // 点击分组标题折叠/展开
  if(h){
    const g=h.parentElement;
    const collapsed=g.classList.toggle('collapsed');
    h.querySelector('.arrow').textContent=collapsed?'▸':'▾';
    return;
  }
  const btn=ev.target.closest('button');if(!btn)return;
  ev.preventDefault();ev.stopPropagation();
  const card=ev.target.closest('.card');const id=card.dataset.id;
  if(btn.classList.contains('del')){
    const s=sites.find(x=>x.id==id);
    if(!s.hidden){  // 未隐藏 -> 软删除(移入已隐藏,可恢复)
      try{await api('/api/sites/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({hidden:1})});await load()}catch(e){alert(e.message)}
    }else{          // 已隐藏 -> 彻底删除
      if(!confirm(`彻底删除「${s.name}」?此操作不可恢复`))return;
      try{await api('/api/sites/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}
    }
  }else if(btn.classList.contains('tg')){
    const s=sites.find(x=>x.id==id);
    try{await api('/api/sites/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({hidden:s.hidden?0:1})});await load()}catch(e){alert(e.message)}
  }else if(btn.classList.contains('fav')){
    const s=sites.find(x=>x.id==id);
    try{await api('/api/sites/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({favorite:s.favorite?0:1})});await load()}catch(e){alert(e.message)}
  }else if(btn.classList.contains('ed')){
    document.querySelectorAll('.card.editing').forEach(c=>c.classList.remove('editing'));
    card.classList.add('editing');
    card.querySelector('.f-name').focus();
  }else if(btn.classList.contains('ok')){
    try{
      await api('/api/sites/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:card.querySelector('.f-name').value,group_name:card.querySelector('.f-group').value})});
      await load();
    }catch(e){alert(e.message)}
  }else if(btn.classList.contains('no')){
    card.classList.remove('editing');
  }
});

load();
</script>
</body>
</html>
