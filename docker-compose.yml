services:
  nethub:
    build:
      context: .
      args:
        # 本机 Docker Hub 直连被墙 -> 用国内加速器; 公网/CI 用官方源(默认)
        BASE_IMAGE: docker.1ms.run/library/python:3.11-slim
        PIP_INDEX: -i https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: nethub
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - SCAN_SUBNET=192.168.1.0/24
      - SCAN_INTERVAL_HOURS=6
      - SCAN_FULL_PORTS=1
    restart: unless-stopped
